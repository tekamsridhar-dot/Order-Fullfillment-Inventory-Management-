services:

  db:
    image: postgres:16
    container_name: order_fulfillment_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: order_fulfillment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_fulfillment_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: order_fulfillment_api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/order_fulfillment_db

      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      MAX_UPLOAD_SIZE: 5242880
      UPLOAD_DIR: uploads

    ports:
      - "8000:8000"

    volumes:
      - ./uploads:/app/uploads


volumes:
  postgres_data: